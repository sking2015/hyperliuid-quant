x-backend: &backend
  build: ./backend
  environment:
    DATABASE_URL: postgresql://quant:${POSTGRES_PASSWORD:-quant}@db:5432/quant
    PAPER_ONLY: ${PAPER_ONLY:-true}
    SNAPSHOT_SECONDS: ${SNAPSHOT_SECONDS:-60}
    BOOTSTRAP_BARS: ${BOOTSTRAP_BARS:-120}
    DISK_WARN_MIB: ${DISK_WARN_MIB:-2048}
    DISK_STOP_MIB: ${DISK_STOP_MIB:-512}
    DATA_MAX_MIB: ${DATA_MAX_MIB:-10240}
    DISK_PROBE_PATH: ${DISK_PROBE_PATH:-}
  volumes:
    - market-data:/var/lib/quant
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: quant
      POSTGRES_DB: quant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quant}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U quant -d quant"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped
  api:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"
  market:
    <<: *backend
    command: ["python", "-m", "app.workers.market"]
  backtest:
    <<: *backend
    command: ["python", "-m", "app.workers.backtest"]
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on: [api]
    restart: unless-stopped

volumes:
  pg-data:
  market-data:

